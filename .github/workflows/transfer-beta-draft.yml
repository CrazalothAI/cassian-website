name: Temporary verified beta draft transfer
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Exact seven-file v8.0.0 transfer manifest
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cassian-v8-beta-draft-transfer
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Copy exact verified files into an unpublished draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRANSFER_MANIFEST: ${{ inputs.manifest }}
        run: python3 tools/transfer-beta-draft.py
